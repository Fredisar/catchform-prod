# Blueprint Render : crée l'app web + la base Postgres en un clic.
services:
  - type: web
    name: catchform
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: flask db upgrade && gunicorn wsgi:app --workers 1 --threads 8 --timeout 60
    healthCheckPath: /healthz
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: SESSION_COOKIE_SECURE
        value: "1"
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATABASE_URL
        fromDatabase:
          name: catchform-db
          property: connectionString

databases:
  - name: catchform-db
    plan: free
    region: frankfurt
    databaseName: catchform
    user: catchform
